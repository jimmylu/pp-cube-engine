cubes:
  - name: sales
    sql_table: dw.sales_dtl
    data_source: warehouse
    dimensions:
      - name: order_no
        sql: "{CUBE}.order_no"
        type: number
        primary_key: true
        title: Order number
        description: Order identifier
        public: false
        meta:
          owner: team-a
          tier: 2
          ratio: 1.2699041298821259
          certified: true
          retired_on: null
          tags: [finance, daily]
          contact:
            channel: analytics
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
      - { name: is_valid, sql: "{CUBE}.is_valid = 1", type: boolean }
      - { name: sold_at, sql: "{CUBE}.sold_at", type: time }
    measures:
      - { name: row_count, type: count }
      - { name: order_count, type: count_distinct, sql: "{CUBE}.order_no" }
      - name: amount
        type: sum
        sql: "{CUBE}.amount"
        filters:
          - sql: "{CUBE}.category_cd = 'TOY'"
        title: Amount
        description: Net sales amount
        public: true
        format: currency
        meta:
          unit: each
      - { name: avg_amount, type: avg, sql: "{CUBE}.amount" }
      - { name: min_amount, type: min, sql: "{CUBE}.amount" }
      - { name: max_amount, type: max, sql: "{CUBE}.amount" }
      - { name: amount_per_order, type: number, sql: "{amount} / NULLIF({order_count}, 0)" }
