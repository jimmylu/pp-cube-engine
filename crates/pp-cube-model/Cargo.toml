[package]
name = "pp-cube-model"
description = "Contract types, model loading and baseline validation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The JSON parser. serde_json rounds some floats on parsing unless its
# float_roundtrip feature is on, and that feature would also change how the
# upstream planner's serde_json is built. This fork is a separate package.
serde_json_lenient = { version = "0.2", features = ["float_roundtrip"] }
serde_norway = "0.9"
sqlparser = { version = "=0.64.0", default-features = false, features = ["std", "visitor"] }

[lints]
workspace = true
