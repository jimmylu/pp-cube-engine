[package]
name = "pp-cube-model"
description = "Contract types, model loading and baseline validation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it serde_json rounds some fractions on parsing, so
# the same number loaded from YAML and from JSON would differ.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_norway = "0.9"

[lints]
workspace = true
