[package]
name = "pp-cube-adapter"
description = "Implements the bridge interfaces the upstream planner requires."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Same version requirements as the pinned planner; the root manifest patches
# chrono-tz to the fork upstream uses.
chrono = "0.4.15"
chrono-tz = "0.10.4"
cubenativeutils = { path = "../../vendor/cube/rust/cube/cubenativeutils" }
cubesqlplanner = { path = "../../vendor/cube/rust/cube/cubesqlplanner/cubesqlplanner" }
# Same version requirement and features as the pinned planner.
minijinja = { version = "1", features = ["json", "loader"] }
pp-cube-dialect = { path = "../pp-cube-dialect" }
pp-cube-model = { path = "../pp-cube-model" }

[lints]
workspace = true
