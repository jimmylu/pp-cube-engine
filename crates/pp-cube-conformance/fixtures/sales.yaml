cubes:
  - name: sales
    sql_table: dw.sales_dtl
    data_source: warehouse
    joins:
      - { name: stores, relationship: many_to_one, sql: "{CUBE}.store_cd = {stores.store_cd}" }
      - { name: receipts, relationship: one_to_one, sql: "{CUBE}.receipt_no = {receipts.receipt_no}" }
      # The condition reads `regions`, which is neither side of this join.
      - { name: promos, relationship: many_to_one, sql: "{CUBE}.promo_cd = {promos.promo_cd} AND {promos.region_cd} = {regions.region_cd}" }
    dimensions:
      - { name: sale_id, sql: "{CUBE}.sale_id", type: number, primary_key: true }
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
      - { name: category_cd, sql: "{CUBE}.category_cd", type: string }
      - { name: region_cd, sql: "{CUBE}.region_cd", type: string }
      - { name: is_valid, sql: "{CUBE}.is_valid = 1", type: boolean }
      - { name: qty, sql: "{CUBE}.qty", type: number }
      - name: sold_at
        sql: "{CUBE}.sold_at"
        type: time
        granularities:
          # Counted from an origin, in days and in quarters.
          - { name: two_days, interval: 2 day, origin: "2026-10-01" }
          - { name: half_year, interval: 2 quarter, origin: "2026-01-01" }
          # Weeks that start on Thursday: natural weeks, moved.
          - { name: retail_week, interval: 1 week, offset: 3 day }
    measures:
      - { name: row_count, type: count }
      - { name: order_count, type: count_distinct, sql: "{CUBE}.order_no" }
      - { name: order_count_approx, type: count_distinct_approx, sql: "{CUBE}.order_no" }
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
      - { name: avg_amount, type: avg, sql: "{CUBE}.amount" }
      - { name: min_amount, type: min, sql: "{CUBE}.amount" }
      - { name: max_amount, type: max, sql: "{CUBE}.amount" }
      - name: toy_amount
        type: sum
        sql: "{CUBE}.amount"
        filters:
          - sql: "{CUBE}.category_cd = 'TOY'"
      - { name: amount_per_order, type: number, sql: "{amount} / NULLIF({order_count}, 0)" }
      # Over a window of time that ends at each period, or runs from its start.
      - { name: amount_3d, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: 3 day } }
      - { name: amount_2d, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: 2 day } }
      - { name: orders_2d, type: count_distinct, sql: "{CUBE}.order_no", rolling_window: { trailing: 2 day } }
      - { name: amount_so_far, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: unbounded } }
      - { name: amount_mtd, type: sum, sql: "{CUBE}.amount", rolling_window: { type: to_date, granularity: month } }
      # The amount of the day before, and the change from it.
      - name: amount_prior_day
        type: number
        sql: "{amount}"
        multi_stage: true
        time_shift:
          - { time_dimension: sold_at, interval: 1 day, type: prior }
      - { name: amount_change, type: number, sql: "{amount} - {amount_prior_day}", multi_stage: true }
    segments:
      - { name: toys, sql: "{CUBE}.category_cd = 'TOY'" }
  - name: stores
    sql_table: dw.dim_store
    data_source: warehouse
    joins:
      - { name: regions, relationship: many_to_one, sql: "{CUBE}.region_cd = {regions.region_cd}" }
    dimensions:
      - { name: store_cd, sql: "{CUBE}.store_cd", type: string, primary_key: true }
      - { name: store_name, sql: "{CUBE}.store_name", type: string }
    measures:
      - { name: store_count, type: count }
      - { name: name_count, type: count_distinct, sql: "{CUBE}.store_name" }
      - { name: floor_area, type: sum, sql: "{CUBE}.floor_area" }
  - name: regions
    sql_table: dw.dim_region
    data_source: warehouse
    dimensions:
      - { name: region_cd, sql: "{CUBE}.region_cd", type: string, primary_key: true }
      - { name: region_name, sql: "{CUBE}.region_name", type: string }
  # One receipt per sale at most.
  - name: receipts
    sql_table: dw.receipt
    data_source: warehouse
    dimensions:
      - { name: receipt_no, sql: "{CUBE}.receipt_no", type: string, primary_key: true }
    measures:
      - { name: tax, type: sum, sql: "{CUBE}.tax" }
      - { name: receipt_count, type: count }
      - { name: tax_per_receipt, type: number, sql: "{tax} / NULLIF({receipt_count}, 0)" }
  # A promotion runs per region.
  - name: promos
    sql_table: dw.promo
    data_source: warehouse
    dimensions:
      - { name: promo_cd, sql: "{CUBE}.promo_cd", type: string, primary_key: true }
      - { name: region_cd, sql: "{CUBE}.region_cd", type: string, primary_key: true }
      - { name: promo_name, sql: "{CUBE}.promo_name", type: string }
  # Two more facts, each joined to stores and to nothing else.
  - name: refunds
    sql_table: dw.refund_dtl
    data_source: warehouse
    joins:
      - { name: stores, relationship: many_to_one, sql: "{CUBE}.store_cd = {stores.store_cd}" }
    dimensions:
      - { name: refund_id, sql: "{CUBE}.refund_id", type: number, primary_key: true }
    measures:
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
      - { name: refund_count, type: count }
  - name: visits
    sql_table: dw.visit
    data_source: warehouse
    joins:
      - { name: stores, relationship: many_to_one, sql: "{CUBE}.store_cd = {stores.store_cd}" }
    dimensions:
      - { name: visit_id, sql: "{CUBE}.visit_id", type: number, primary_key: true }
    measures:
      - { name: visit_count, type: count }
  # Every query on this cube carries the row restriction of its source.
  - name: valid_sales
    sql: SELECT channel_cd, amount FROM dw.sales_dtl WHERE is_valid = 1
    data_source: warehouse
    dimensions:
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
    measures:
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
views:
  # Sales with their store, its region and their receipt, under one name.
  - name: sales_overview
    cubes:
      - join_path: sales
        includes: [amount, row_count, amount_per_order, channel_cd, sold_at]
      - join_path: sales.stores
        prefix: true
        includes: [store_name, floor_area]
      - join_path: sales.stores.regions
        includes: [region_name]
      - join_path: sales.receipts
        includes: [tax]
