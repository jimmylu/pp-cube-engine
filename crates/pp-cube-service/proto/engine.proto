syntax = "proto3";
package ppcube.engine.v1;

// Compiles Cube queries into SQL and parameters. Never executes SQL.
service CubeEngine {
  rpc Compile(CompileRequest) returns (CompileResponse);
  rpc ValidateModel(ValidateModelRequest) returns (ValidateModelResponse);
  rpc GetMeta(GetMetaRequest) returns (GetMetaResponse);

  // Model version management. Refused with PERMISSION_DENIED unless the host enabled it.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Validates and makes a version available. Versions are immutable: the same content
  // again is accepted and changes nothing; different content is ALREADY_EXISTS.
  rpc PublishModel(PublishModelRequest) returns (PublishModelResponse);
  // Stops offering a version. Compilations that already selected it finish on it.
  rpc RetireModel(RetireModelRequest) returns (RetireModelResponse);
}

// What produced a response: fixed for a running service and a model version.
message Identity {
  string kernel_version = 1;
  string upstream_pin = 2;
  string model_version = 3;
  // The service's digest of the version's typed content: "sha256:" and 64 hex digits.
  // Independent of YAML or JSON formatting.
  string model_digest = 4;
}

message CompileRequest {
  string model_version = 1;
  string query_json = 2;             // Cube query format
  string dialect = 3;                // presto | doris; must serve every data source the query reads
  string timezone = 4;
  repeated string security_filters_json = 5;  // one Cube filter each, appended as top-level AND entries
  string request_id = 6;
}

message CompileResponse {
  oneof result {
    Compiled compiled = 1;
    CompileFailure failure = 2;
  }
  Identity identity = 3;
}

message Compiled {
  string sql = 1;
  // One value per placeholder, in placeholder order. Bind them; never splice them into the SQL.
  repeated Parameter params = 2;
  repeated OutputColumn columns = 3;
  repeated UsedCube used_cubes = 4;
  bytes fingerprint = 5;
  // Engine session settings the SQL needs. The executor must apply every one.
  repeated SessionProperty session_properties = 6;
}

message Parameter {
  oneof value {
    string text = 1;
    double number = 2;
    bool boolean = 3;
    Null null = 4;
  }
}
message Null {}

message OutputColumn {
  string alias = 1;
  string member = 2;
  string type = 3;                   // string | number | boolean | time
  optional string granularity = 4;
}

message UsedCube {
  string name = 1;
  string data_source = 2;
  repeated Table tables = 3;
}
// A qualified table name as its components, without quoting.
message Table { repeated string path = 1; }

message SessionProperty {
  string name = 1;
  string value = 2;
}

enum FailureKind {
  FAILURE_KIND_UNSPECIFIED = 0;
  FAILURE_KIND_MODEL = 1;        // the model is invalid or outside the baseline
  FAILURE_KIND_QUERY = 2;        // the caller can correct the query
  FAILURE_KIND_UNSUPPORTED = 3;  // recognized, but beyond the baseline or the dialect
  FAILURE_KIND_INTERNAL = 4;
}
message CompileFailure {
  FailureKind kind = 1;
  string message = 2;              // member names and rules only
}

message ValidateModelRequest { bytes model_bundle = 1; }
message ValidateModelResponse {
  repeated ModelIssue issues = 1;
  // The content digest, present only when there are no issues.
  optional string model_digest = 2;
}
message ModelIssue { string path = 1; string rule = 2; string message = 3; }

message GetMetaRequest { string model_version = 1; }
// Public cubes and members only. Never SQL or physical tables.
message GetMetaResponse {
  repeated CubeMeta cubes = 1;
  Identity identity = 2;
}
message CubeMeta {
  string name = 1;
  optional string title = 2;
  optional string description = 3;
  string data_source = 4;
  repeated MeasureMeta measures = 5;
  repeated DimensionMeta dimensions = 6;
  repeated string segments = 7;
  repeated JoinMeta joins = 8;       // to public cubes only
  optional string meta_json = 9;     // the model's `meta`, as written
}
message MeasureMeta {
  string name = 1;
  string type = 2;
  optional string title = 3;
  optional string description = 4;
  optional string format = 5;
  optional string meta_json = 6;
}
message DimensionMeta {
  string name = 1;
  string type = 2;
  optional string title = 3;
  optional string description = 4;
  bool primary_key = 5;
  optional string meta_json = 6;
}
message JoinMeta {
  string cube = 1;
  string relationship = 2;           // many_to_one | one_to_one
}

message ListModelsRequest {}
message ListModelsResponse {
  repeated ModelVersion models = 1;  // ordered by version
  string kernel_version = 2;
  string upstream_pin = 3;
}
message ModelVersion {
  string model_version = 1;
  string model_digest = 2;
}

message PublishModelRequest {
  string model_version = 1;
  bytes model_bundle = 2;            // UTF-8 YAML or JSON
  // When set, the content digest must equal it or nothing is published.
  optional string expected_digest = 3;
}
message PublishModelResponse {
  oneof result {
    Published published = 1;
    Rejected rejected = 2;
  }
}
message Published {
  Identity identity = 1;
  bool created = 2;                  // false when this content was already available
}
// The model is invalid; nothing was published.
message Rejected { repeated ModelIssue issues = 1; }

message RetireModelRequest { string model_version = 1; }
message RetireModelResponse { Identity identity = 1; }  // what was retired
