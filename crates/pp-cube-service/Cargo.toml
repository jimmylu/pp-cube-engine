[package]
name = "pp-cube-service"
description = "The gRPC service and process entry point."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pp-cube-model = { path = "../pp-cube-model" }
pp-cube-compile = { path = "../pp-cube-compile" }
tokio = { version = "1.54.1", default-features = false, features = [
  "sync",
  "rt",
  "net",
  "signal",
  "time",
  "io-util",
  "macros",
] }

# TLS through rustls with the ring provider; both are already in the lockfile.
tonic = { version = "0.14.9", features = ["tls-ring"] }
tonic-prost = "0.14.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "net", "macros"] }
