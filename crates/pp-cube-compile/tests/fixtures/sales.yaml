cubes:
  - name: sales
    sql_table: dw.sales_dtl
    data_source: warehouse
    dimensions:
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
      - { name: is_valid, sql: "{CUBE}.is_valid = 1", type: boolean }
      - { name: qty, sql: "{CUBE}.qty", type: number }
      - { name: sold_at, sql: "{CUBE}.sold_at", type: time }
    measures:
      - { name: row_count, type: count }
      - { name: order_count, type: count_distinct, sql: "{CUBE}.order_no" }
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
      - { name: avg_amount, type: avg, sql: "{CUBE}.amount" }
      - { name: min_amount, type: min, sql: "{CUBE}.amount" }
      - { name: max_amount, type: max, sql: "{CUBE}.amount" }
      - name: toy_amount
        type: sum
        sql: "{CUBE}.amount"
        filters:
          - sql: "{CUBE}.category_cd = 'TOY'"
      - { name: amount_per_order, type: number, sql: "{amount} / NULLIF({order_count}, 0)" }
    segments:
      - { name: toys, sql: "{CUBE}.category_cd = 'TOY'" }
  - name: valid_sales
    sql: SELECT channel_cd, amount FROM dw.sales_dtl WHERE is_valid = 1
    data_source: warehouse
    dimensions:
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
    measures:
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
  - name: orders
    sql_table: dw.order_hdr
    data_source: warehouse
    dimensions:
      - { name: order_no, sql: "{CUBE}.order_no", type: number, primary_key: true }
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
    measures:
      - { name: row_count, type: count }
  - name: order_lines
    sql_table: dw.order_line
    data_source: warehouse
    dimensions:
      - { name: order_no, sql: "{CUBE}.order_no", type: number, primary_key: true }
      - { name: line_no, sql: "{CUBE}.line_no", type: number, primary_key: true }
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
    measures:
      - { name: row_count, type: count }
