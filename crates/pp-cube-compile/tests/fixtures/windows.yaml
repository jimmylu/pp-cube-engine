cubes:
  - name: sales
    sql_table: dw.sales_dtl
    data_source: warehouse
    joins:
      - { name: stores, relationship: many_to_one, sql: "{CUBE}.store_cd = {stores.store_cd}" }
    dimensions:
      - { name: sale_id, sql: "{CUBE}.sale_id", type: number, primary_key: true }
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
      - { name: sold_at, sql: "{CUBE}.sold_at", type: time }
    measures:
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
      - { name: sale_count, type: count }
      # Windows that end, or start, at each period.
      - { name: amount_7d, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: 7 day } }
      - { name: amount_around, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: 1 month, leading: 1 day, offset: start } }
      - { name: amount_so_far, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: unbounded } }
      - { name: amount_2w, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: 2 week } }
      - { name: avg_7d, type: avg, sql: "{CUBE}.amount", rolling_window: { trailing: 7 day } }
      - { name: buyers_7d, type: count_distinct, sql: "{CUBE}.buyer_id", rolling_window: { trailing: 7 day } }
      # Period to date.
      - { name: amount_mtd, type: sum, sql: "{CUBE}.amount", rolling_window: { type: to_date, granularity: month } }
      - { name: amount_ytd, type: sum, sql: "{CUBE}.amount", rolling_window: { type: to_date, granularity: year } }
      # The same measure at another time.
      - name: amount_prior_year
        type: number
        sql: "{amount}"
        multi_stage: true
        time_shift:
          - { time_dimension: sold_at, interval: 1 year, type: prior }
      - name: amount_next_month
        type: number
        sql: "{amount}"
        multi_stage: true
        time_shift:
          - { interval: 1 month, type: next }
      - name: amount_prior_quarter
        type: number
        sql: "{amount}"
        multi_stage: true
        time_shift:
          - { interval: 1 quarter, type: prior }
      - { name: growth, type: number, sql: "({amount} - {amount_prior_year}) / NULLIF({amount_prior_year}, 0)", multi_stage: true }
  - name: stores
    sql_table: dw.dim_store
    data_source: warehouse
    dimensions:
      - { name: store_cd, sql: "{CUBE}.store_cd", type: string, primary_key: true }
      - { name: store_name, sql: "{CUBE}.store_name", type: string }
      - { name: opened_at, sql: "{CUBE}.opened_at", type: time }
    segments:
      - { name: open, sql: "{CUBE}.closed_at IS NULL" }
