cubes:
  - name: sales
    sql_table: dw.sales_dtl
    data_source: warehouse
    joins:
      - { name: stores, relationship: many_to_one, sql: "{CUBE}.store_cd = {stores.store_cd}" }
    dimensions:
      - { name: sale_id, sql: "{CUBE}.sale_id", type: number, primary_key: true }
      - { name: channel_cd, sql: "{CUBE}.channel_cd", type: string }
      - name: sold_at
        sql: "{CUBE}.sold_at"
        type: time
        granularities:
          # Counted from an origin.
          - { name: half_year, interval: 6 month, origin: "2026-01-01" }
          - { name: fortnight, interval: 2 week, origin: "2025-12-29" }
          # Natural periods, moved.
          - { name: fiscal_year, interval: 1 year, offset: 3 month }
          - { name: month_from_15, interval: 1 month, origin: "2026-01-15" }
    measures:
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
      - { name: sale_count, type: count }
      - { name: buyers, type: count_distinct, sql: "{CUBE}.buyer_id" }
      - { name: buyers_approx, type: count_distinct_approx, sql: "{CUBE}.buyer_id" }
      - { name: per_buyer, type: number, sql: "{amount} / NULLIF({buyers_approx}, 0)" }
      - { name: toy_amount, type: sum, sql: "{CUBE}.amount", filters: [{ sql: "{CUBE}.category_cd = 'TOY'" }] }
      - { name: amount_7d, type: sum, sql: "{CUBE}.amount", rolling_window: { trailing: 7 day } }
  - name: stores
    sql_table: dw.dim_store
    data_source: warehouse
    dimensions:
      - { name: store_cd, sql: "{CUBE}.store_cd", type: string, primary_key: true }
      - { name: store_name, sql: "{CUBE}.store_name", type: string }
    measures:
      - { name: floor_area, type: sum, sql: "{CUBE}.floor_area" }
  - name: refunds
    sql_table: dw.refund_dtl
    data_source: warehouse
    dimensions:
      - { name: refund_id, sql: "{CUBE}.refund_id", type: number, primary_key: true }
    measures:
      - { name: amount, type: sum, sql: "{CUBE}.amount" }
