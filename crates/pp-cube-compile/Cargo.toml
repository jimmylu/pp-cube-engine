[package]
name = "pp-cube-compile"
description = "The compile facade: model, query and context in; SQL and parameters out."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pp-cube-adapter = { path = "../pp-cube-adapter" }
pp-cube-dialect = { path = "../pp-cube-dialect" }
pp-cube-model = { path = "../pp-cube-model" }

[dev-dependencies]
# Held at 1.43: later releases depend on tempfile, whose rustix switches on a
# bitflags feature, and bitflags is one of the planner's dependencies.
insta = { version = "~1.43", default-features = false }

[lints]
workspace = true
