# Presto dialect templates, transcribed from Cube at the commit below.
# Only the templates the kernel renders so far are here; a request for any
# other fails with an error naming it. `source` is the upstream file under
# packages/cubejs-schema-compiler/src/adapter/ that defines the text.
#
# The `driver/` templates are not templates upstream: each is the body of
# the method of that name in `source`, with its arguments as holes.
commit: 486f0d26bab58ab4fe0be0e4cdd39818b35a7870
# BaseQuery.ts, timestampPrecision; Presto does not override it.
timestamp_precision: 3
# Presto's INTERVAL literal: year-month and day-time fields only, so no week
# and no quarter, although PrestodbQuery.ts writes whatever unit it is given.
interval_units: [year, month, day, hour, minute, second]
templates:
  statements/select:
    source: PrestodbQuery.ts
    text: "{% if ctes %} WITH \n{{ ctes | join(',\n') }}\n{% endif %}SELECT {% if distinct %}DISTINCT {% endif %}{{ select_concat | map(attribute='aliased') | join(', ') }}  {% if from %}\nFROM (\n  {{ from }}\n) AS {{ from_alias }} {% elif from_prepared %}\nFROM {{ from_prepared }}{% endif %}{% for join in joins %}\n{{ join }}{% endfor %}{% if filter %}\nWHERE {{ filter }}{% endif %}{% if group_by %} GROUP BY {{ group_by }}{% endif %}{% if having %}\nHAVING {{ having }}{% endif %}{% if order_by %} ORDER BY {{ order_by | map(attribute='expr') | join(', ') }}{% endif %}{% if offset is not none %}\nOFFSET {{ offset }}{% endif %}{% if limit is not none %}\nLIMIT {{ limit }}{% endif %}"
  functions/COUNT_DISTINCT:
    source: BaseQuery.ts
    text: "COUNT(DISTINCT {{ args_concat }})"
  statements/group_by_exprs:
    source: BaseQuery.ts
    text: "{{ group_by | map(attribute='index') | join(', ') }}"
  expressions/column_aliased:
    source: BaseQuery.ts
    text: "{{expr}} {{quoted_alias}}"
  expressions/query_aliased:
    source: BaseQuery.ts
    text: "{{ query }} AS {{ quoted_alias }}"
  expressions/wrap_boolean_dimension:
    source: BaseQuery.ts
    text: "{{ expr }}"
  expressions/cast:
    source: BaseQuery.ts
    text: "CAST({{ expr }} AS {{ data_type }})"
  expressions/concat_strings:
    source: BaseQuery.ts
    text: "{{ strings | join(' || ' ) }}"
  types/string:
    source: PrestodbQuery.ts
    text: "VARCHAR"
  expressions/order_by:
    source: BaseQuery.ts
    text: "{% if index %} {{ index }} {% else %} {{ expr }} {% endif %} {% if asc %}ASC{% else %}DESC{% endif %}{% if nulls_first %} NULLS FIRST{% endif %}"
  quotes/identifiers:
    source: BaseQuery.ts
    text: '"'
  quotes/escape:
    source: BaseQuery.ts
    text: '""'
  params/param:
    source: BaseQuery.ts
    text: "?"
  expressions/wrap_segment_filter:
    source: BaseQuery.ts
    text: "{{ expr }}"
  filters/equals:
    source: BaseQuery.ts
    text: "{{ column }} = {{ value }}{{ is_null_check }}"
  filters/not_equals:
    source: BaseQuery.ts
    text: "{{ column }} <> {{ value }}{{ is_null_check }}"
  filters/or_is_null_check:
    source: BaseQuery.ts
    text: " OR {{ column }} IS NULL"
  filters/set_where:
    source: BaseQuery.ts
    text: "{{ column }} IS NOT NULL"
  filters/not_set_where:
    source: BaseQuery.ts
    text: "{{ column }} IS NULL"
  filters/in:
    source: BaseQuery.ts
    text: "{{ column }} IN ({{ values_concat }}){{ is_null_check }}"
  filters/not_in:
    source: BaseQuery.ts
    text: "{{ column }} NOT IN ({{ values_concat }}){{ is_null_check }}"
  filters/gt:
    source: BaseQuery.ts
    text: "{{ column }} > {{ param }}"
  filters/gte:
    source: BaseQuery.ts
    text: "{{ column }} >= {{ param }}"
  filters/lt:
    source: BaseQuery.ts
    text: "{{ column }} < {{ param }}"
  filters/lte:
    source: BaseQuery.ts
    text: "{{ column }} <= {{ param }}"
  filters/like_pattern:
    source: PrestodbQuery.ts
    text: "CONCAT({% if start_wild %}'%'{% else %}''{% endif %}, LOWER({{ value }}), {% if end_wild %}'%'{% else %}''{% endif %}) ESCAPE '\\'"
  filters/like_escape_char:
    source: PrestodbQuery.ts
    text: "\\"
  filters/always_true:
    source: BaseQuery.ts
    text: "1 = 1"
  tesseract/ilike:
    source: PrestodbQuery.ts
    text: "LOWER({{ expr }}) {% if negated %}NOT {% endif %} LIKE {{ pattern }}"
  tesseract/bool_param_cast:
    source: PrestodbQuery.ts
    text: "CAST({{ expr }} AS BOOLEAN)"
  tesseract/number_param_cast:
    source: PrestodbQuery.ts
    text: "CAST({{ expr }} AS DOUBLE)"
  filters/time_range_filter:
    source: BaseQuery.ts
    text: "{{ column }} >= {{ from_timestamp }} AND {{ column }} <= {{ to_timestamp }}"
  filters/time_not_in_range_filter:
    source: BaseQuery.ts
    text: "{{ column }} < {{ from_timestamp }} OR {{ column }} > {{ to_timestamp }}"
  driver/time_stamp_cast:
    source: PrestodbQuery.ts
    text: "from_iso8601_timestamp({{ value }})"
  driver/time_grouped_column:
    source: PrestodbQuery.ts
    text: "date_trunc('{{ granularity }}', {{ dimension }})"
  driver/convert_tz:
    source: PrestodbQuery.ts
    text: "CAST(date_add('minute', timezone_minute(COALESCE({{ field }}, CAST(NULL AS TIMESTAMP)) AT TIME ZONE '{{ timezone }}'), date_add('hour', timezone_hour(COALESCE({{ field }}, CAST(NULL AS TIMESTAMP)) AT TIME ZONE '{{ timezone }}'), COALESCE({{ field }}, CAST(NULL AS TIMESTAMP)))) AS TIMESTAMP)"
  statements/join:
    source: BaseQuery.ts
    text: "{{ join_type }} JOIN {{ source }} ON {{ condition }}"
  tesseract/join_types_left:
    source: BaseQuery.ts
    text: "LEFT"
  expressions/column_reference:
    source: BaseQuery.ts
    text: "{% if table_name %}{{ table_name }}.{% endif %}{{ name }}"
  statements/cte:
    source: BaseQuery.ts
    text: "{{ alias }} AS ({{ query | indent(2, true) }})"
  expressions/is_null:
    source: BaseQuery.ts
    text: "({{ expr }} IS {% if negate %}NOT {% endif %}NULL)"
  tesseract/join_types_inner:
    source: BaseQuery.ts
    text: "INNER"
  driver/date_time_cast:
    source: PrestodbQuery.ts
    text: "from_iso8601_timestamp({{ value }})"
  driver/interval_string:
    source: PrestodbQuery.ts
    text: "'{{ value }}' {{ unit }}"
  driver/add_interval:
    source: PrestodbQuery.ts
    text: "{{ date }} + interval {{ interval }}"
  driver/subtract_interval:
    source: PrestodbQuery.ts
    text: "{{ date }} - interval {{ interval }}"
  statements/time_series_select:
    source: PrestodbQuery.ts
    text: "SELECT from_iso8601_timestamp(dates.f) date_from, from_iso8601_timestamp(dates.t) date_to \nFROM (\n{% for time_item in seria  %}    select '{{ time_item[0] }}' f, '{{ time_item[1] }}' t \n{% if not loop.last %} UNION ALL\n{% endif %}{% endfor %}) AS dates"
  statements/generated_time_series_select:
    source: PrestodbQuery.ts
    text: "SELECT d AS date_from,\ndate_add('MILLISECOND', -1, d + interval {{ granularity }}) AS date_to\nFROM UNNEST(\nSEQUENCE(CAST(from_iso8601_timestamp({{ start }}) AS TIMESTAMP), CAST(from_iso8601_timestamp({{ end }}) AS TIMESTAMP), INTERVAL {{ granularity }})\n) AS dates(d)"
  statements/generated_time_series_with_cte_range_source:
    source: PrestodbQuery.ts
    text: "SELECT d AS date_from,\ndate_add('MILLISECOND', -1, d + interval {{ granularity }}) AS date_to\nFROM {{ range_source }} CROSS JOIN UNNEST(\nSEQUENCE(CAST({{ range_source }}.{{ min_name }} AS TIMESTAMP), CAST({{ range_source }}.{{ max_name }} AS TIMESTAMP), INTERVAL {{ granularity }})\n) AS dates(d)"
  statements/time_series_get_range:
    source: BaseQuery.ts
    text: "SELECT {{ max_expr }} as {{ quoted_max_name }},\n{{ min_expr }} as {{ quoted_min_name }}\nFROM {{ from_prepared }}\n{% if filter %}WHERE {{ filter }}{% endif %}"
  expressions/rolling_window_expr_timestamp_cast:
    source: BaseQuery.ts
    text: "{{ value }}"
  functions/MAX:
    source: BaseQuery.ts
    text: "MAX({{ args_concat }})"
  functions/MIN:
    source: BaseQuery.ts
    text: "MIN({{ args_concat }})"
  driver/count_distinct_approx:
    source: PrestodbQuery.ts
    text: "approx_distinct({{ sql }})"
  driver/date_bin:
    source: PrestodbQuery.ts
    text: "date_add('{{ unit }}',\n      floor(\n        date_diff('{{ unit }}', CAST(from_iso8601_timestamp('{{ origin }}') AS TIMESTAMP), {{ source }}) / {{ count }}\n      ) * {{ count }},\n      CAST(from_iso8601_timestamp('{{ origin }}') AS TIMESTAMP)\n    )"
