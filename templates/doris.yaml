# Apache-2.0; common templates adapted from pinned Cube BaseQuery.ts/MysqlQuery.ts.
# Doris SELECT ordering and STRING type are local overrides; no full B0 acceptance.
commit: 486f0d26bab58ab4fe0be0e4cdd39818b35a7870
# BaseQuery.ts, timestampPrecision; Presto does not override it.
timestamp_precision: 3
# The units of Doris DATE_ADD and DATE_SUB.
interval_units: [year, quarter, month, week, day, hour, minute, second]
templates:
  statements/select:
    source: BaseQuery.ts
    text: "{% if ctes %} WITH \n{{ ctes | join(',\n') }}\n{% endif %}SELECT {% if distinct %}DISTINCT {% endif %}{{ select_concat | map(attribute='aliased') | join(', ') }}  {% if from %}\nFROM (\n  {{ from }}\n) AS {{ from_alias }} {% elif from_prepared %}\nFROM {{ from_prepared }}{% endif %}{% for join in joins %}\n{{ join }}{% endfor %}{% if filter %}\nWHERE {{ filter }}{% endif %}{% if group_by %} GROUP BY {{ group_by }}{% endif %}{% if having %}\nHAVING {{ having }}{% endif %}{% if order_by %} ORDER BY {{ order_by | map(attribute='expr') | join(', ') }}{% endif %}{% if limit is not none %}\nLIMIT {{ limit }}{% if offset is not none %} OFFSET {{ offset }}{% endif %}{% endif %}"
  functions/COUNT_DISTINCT:
    source: BaseQuery.ts
    text: "COUNT(DISTINCT {{ args_concat }})"
  statements/group_by_exprs:
    source: BaseQuery.ts
    text: "{{ group_by | map(attribute='index') | join(', ') }}"
  expressions/column_aliased:
    source: BaseQuery.ts
    text: "{{expr}} {{quoted_alias}}"
  expressions/query_aliased:
    source: BaseQuery.ts
    text: "{{ query }} AS {{ quoted_alias }}"
  expressions/wrap_boolean_dimension:
    source: BaseQuery.ts
    text: "{{ expr }}"
  expressions/cast:
    source: BaseQuery.ts
    text: "CAST({{ expr }} AS {{ data_type }})"
  expressions/concat_strings:
    source: MysqlQuery.ts
    text: "CONCAT({{ strings | join(',') }})"
  types/string:
    source: BaseQuery.ts
    text: "STRING"
  expressions/order_by:
    source: BaseQuery.ts
    text: "{% if index %} {{ index }} {% else %} {{ expr }} {% endif %} {% if asc %}ASC{% else %}DESC{% endif %}{% if nulls_first %} NULLS FIRST{% endif %}"
  quotes/identifiers:
    source: MysqlQuery.ts
    text: '`'
  quotes/escape:
    source: MysqlQuery.ts
    text: '``'
  params/param:
    source: BaseQuery.ts
    text: "?"
  expressions/wrap_segment_filter:
    source: BaseQuery.ts
    text: "{{ expr }}"
  filters/equals:
    source: BaseQuery.ts
    text: "{{ column }} = {{ value }}{{ is_null_check }}"
  filters/not_equals:
    source: BaseQuery.ts
    text: "{{ column }} <> {{ value }}{{ is_null_check }}"
  filters/or_is_null_check:
    source: BaseQuery.ts
    text: " OR {{ column }} IS NULL"
  filters/set_where:
    source: BaseQuery.ts
    text: "{{ column }} IS NOT NULL"
  filters/not_set_where:
    source: BaseQuery.ts
    text: "{{ column }} IS NULL"
  filters/in:
    source: BaseQuery.ts
    text: "{{ column }} IN ({{ values_concat }}){{ is_null_check }}"
  filters/not_in:
    source: BaseQuery.ts
    text: "{{ column }} NOT IN ({{ values_concat }}){{ is_null_check }}"
  filters/gt:
    source: BaseQuery.ts
    text: "{{ column }} > {{ param }}"
  filters/gte:
    source: BaseQuery.ts
    text: "{{ column }} >= {{ param }}"
  filters/lt:
    source: BaseQuery.ts
    text: "{{ column }} < {{ param }}"
  filters/lte:
    source: BaseQuery.ts
    text: "{{ column }} <= {{ param }}"
  filters/always_true:
    source: BaseQuery.ts
    text: "1 = 1"
  tesseract/bool_param_cast:
    source: BaseQuery.ts
    text: "CAST({{ expr }} AS BOOLEAN)"
  tesseract/number_param_cast:
    source: BaseQuery.ts
    text: "CAST({{ expr }} AS DOUBLE)"
  statements/join:
    source: BaseQuery.ts
    text: "{{ join_type }} JOIN {{ source }} ON {{ condition }}"
  tesseract/join_types_left:
    source: BaseQuery.ts
    text: "LEFT"
  filters/like_pattern:
    source: MysqlQuery.ts
    text: "CONCAT({% if start_wild %}'%'{% else %}''{% endif %}, LOWER({{ value }}), {% if end_wild %}'%'{% else %}''{% endif %})"
  filters/like_escape_char:
    source: MysqlQuery.ts
    text: "\\"
  tesseract/ilike:
    source: MysqlQuery.ts
    text: "LOWER({{ expr }}) {% if negated %}NOT {% endif %}LIKE {{ pattern }}"
  filters/time_range_filter:
    source: BaseQuery.ts
    text: "{{ column }} >= {{ from_timestamp }} AND {{ column }} <= {{ to_timestamp }}"
  filters/time_not_in_range_filter:
    source: BaseQuery.ts
    text: "{{ column }} < {{ from_timestamp }} OR {{ column }} > {{ to_timestamp }}"
  driver/time_stamp_cast:
    source: Doris DATETIMEV2
    text: "CAST(LEFT(REPLACE({{ value }}, 'T', ' '), 23) AS DATETIMEV2(3))"
  driver/time_grouped_column:
    source: Doris DATE_TRUNC
    text: "DATE_TRUNC({{ dimension }}, '{{ granularity }}')"
  driver/convert_tz:
    source: Doris CONVERT_TZ
    text: "CONVERT_TZ({{ field }}, 'UTC', '{{ timezone }}')"
  expressions/column_reference:
    source: BaseQuery.ts
    text: "{% if table_name %}{{ table_name }}.{% endif %}{{ name }}"
  statements/cte:
    source: BaseQuery.ts
    text: "{{ alias }} AS ({{ query | indent(2, true) }})"
  expressions/is_null:
    source: BaseQuery.ts
    text: "({{ expr }} IS {% if negate %}NOT {% endif %}NULL)"
  tesseract/join_types_inner:
    source: BaseQuery.ts
    text: "INNER"
  driver/date_time_cast:
    source: Doris DATETIMEV2
    text: "CAST(LEFT(REPLACE({{ value }}, 'T', ' '), 23) AS DATETIMEV2(3))"
  driver/interval_string:
    source: Doris DATE_ADD; Doris 2.1 has no QUARTER unit, so quarters are written as months
    text: "{% if unit == 'quarter' %}{{ value * 3 }} MONTH{% else %}{{ value }} {{ unit | upper }}{% endif %}"
  driver/add_interval:
    source: Doris DATE_ADD
    text: "DATE_ADD({{ date }}, INTERVAL {{ interval }})"
  driver/subtract_interval:
    source: Doris DATE_SUB
    text: "DATE_SUB({{ date }}, INTERVAL {{ interval }})"
  statements/time_series_select:
    source: MysqlQuery.ts; Doris DATETIMEV2
    text: "SELECT CAST(REPLACE(dates.f, 'T', ' ') AS DATETIMEV2(3)) date_from, CAST(REPLACE(dates.t, 'T', ' ') AS DATETIMEV2(3)) date_to \nFROM (\n{% for time_item in seria  %}    select '{{ time_item[0] }}' f, '{{ time_item[1] }}' t \n{% if not loop.last %} UNION ALL\n{% endif %}{% endfor %}) AS dates"
  expressions/rolling_window_expr_timestamp_cast:
    source: BaseQuery.ts
    text: "{{ value }}"
  driver/count_distinct_approx:
    source: Doris APPROX_COUNT_DISTINCT
    text: "APPROX_COUNT_DISTINCT({{ sql }})"
  driver/date_bin:
    source: Doris *_FLOOR; Doris 2.1 has no QUARTER_FLOOR, so quarters are counted in months
    text: "{% if unit == 'quarter' %}MONTH_FLOOR({{ source }}, {{ count * 3 }}{% else %}{{ unit | upper }}_FLOOR({{ source }}, {{ count }}{% endif %}, CAST('{{ origin | replace('T', ' ') }}' AS DATETIMEV2(3)))"
