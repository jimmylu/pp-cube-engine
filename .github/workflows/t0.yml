# The merge-blocking check: scripts/check.sh ci, nothing else. What "passing"
# means is defined in that script, not here.
name: t0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t0:
    name: t0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned upstream
        run: scripts/vendor-sync.sh

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2,typos-cli@1.52.2,taplo-cli@0.10.0

      - name: Check
        env:
          BASE_REF: origin/main
        run: scripts/check.sh ci
