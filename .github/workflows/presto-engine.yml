name: presto-engine

on:
  pull_request:
    paths:
      - 'scripts/engines/**'
      - 'scripts/tests/test_presto*'
      - 'scripts/check.sh'
      - 'crates/**'
      - 'templates/**'
      - '.github/workflows/presto-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presto-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presto-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute pinned engine smoke case
        shell: bash
        run: |
          set -o pipefail
          echo "SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          set +e
          scripts/check.sh engines-container > /tmp/presto-evidence.txt 2>&1
          result=$?
          cat /tmp/presto-evidence.txt
          cat /tmp/presto-evidence.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
