; The environment under test. Copy to itest.ini and fill in.
; No secret goes in this file: a password is named by the environment variable
; that holds it, a token by its file.

[service]
; The compile service: host:port of its gRPC port.
target = ppcube.example.internal:50051
; The certificate authority that signed the service's certificate, as a PEM
; file. Leave out when the system's authorities know it.
ca = /path/to/ca.pem
; The read token, in a file.
token_file = /path/to/read.token
; Only for a service on this host, on loopback, without a token:
; plaintext = true

; One section an engine. `model_version` is the version this test publishes
; for that engine; `data_source` is the name the service was started with for
; it (--data-source <name>=<dialect>).

[engine:presto]
dialect = presto
host = presto.example.internal
port = 8080
user = ppcube-itest
catalog = hive
; A schema of this test's own. Only tables named ins_* are created in it.
schema = ppcube_itest
data_source = warehouse
model_version = itest/presto/v1
; With a password the connection is https:
; password_env = PRESTO_PASSWORD

[engine:doris]
dialect = doris
host = doris-fe.example.internal
port = 9030
user = ppcube_itest
password_env = DORIS_PASSWORD
schema = ppcube_itest
; As many replicas as the cluster asks for of a new table.
replication_num = 3
data_source = doris_warehouse
model_version = itest/doris/v1

[engine:druid]
dialect = druid
; The router, or a broker and overlord behind one address.
url = http://druid-router.example.internal:8888
; Druid has one schema; the test's datasources are told apart by this prefix.
table_prefix = ppcube_itest_
data_source = druid_warehouse
model_version = itest/druid/v1
; user = ppcube_itest
; password_env = DRUID_PASSWORD
